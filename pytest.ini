[pytest]
testpaths = tests
# Unit tests only by default. Run the org/Apollo tests with:
#   .venv/bin/python -m pytest -q -m integration
addopts = -m "not integration"
markers =
    integration: talks to the real Salesforce org or Apollo (network, may create and delete records)
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL
